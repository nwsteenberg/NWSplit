name: Build Ergogen

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Ergogen
        run: npm install -g ergogen@v4.2.1

      - name: Ensure folder exists
        run: mkdir -p output

      - name: Run Ergogen
        run: ergogen . -o output

      - name: Upload build artifact (non-release builds)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: ergogen-output
          path: output

      - name: Create Release (only when tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
