name: Build Ergogen

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Ergogen
        run: npm install -g ergogen@v4.2.1

      - name: Ensure folder exists
        run: mkdir -p output

      - name: Run Ergogen
        run: ergogen config.yaml -o output

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
