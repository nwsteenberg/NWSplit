pcbs:
  plate:
    template: kicad8
    outlines:
      - outline: plate
    footprints:
      mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /^screw/
  pcbLeft:
    template: kicad8
    outlines:
      - outline: _outlinePCBLeft
    footprints:
      mcu: &mcu
        what: promicro
        where: matrix_outer_num
        adjust.shift: [1.3, 22]
      socketsChocv2: &sockets
        what: ceoloide/switch_choc_v1_v2
        where: /^matrix/
        params:
          choc_v1_support: true
          include_stabilizer_pad: false
          include_keycap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
        adjust.rotate: 180
      diode: &diode
        what: ceoloide/diode_tht_sod123
        where: /^matrix/
        params:
          include_tht: false
          include_traces_vias: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust.shift: [-8, 1.5]
        adjust.rotate: 270
      usbBreakout: &usbBreakout
        what: usb_breakout_4p
        where: matrix_inner_num
        params:
          P1: RAW
          P2: "P1" #GP0
          P3: "P0" #GP1
          P4: GND
        adjust.shift: [0, 19.3]
      usbRecepticle: &usbRecepticle
        what: usb_c_16_pin_recepticle
        where: matrix_inner_num
        params:
          GND: GND
          VBUS: RAW
          DP: "P1" #GP0
          DN: "P0" #GP1
        adjust.shift: [0, 21.1]
        adjust.rotate: 180
      reset: &reset
        what: ceoloide/reset_switch_smd_side
        params.side: B
        where: matrix_outer_num
        adjust.shift: [-14.5, 0]
        adjust.rotate: 90
      power: &power
        what: ceoloide/power_switch_smd_side
        params.side: B
        where: matrix_outer_top
        adjust.shift: [-14.5, 0]
        adjust.rotate: 180
      batteryConnector: &batteryConnector
        what: ceoloide/battery_connector_jst_ph_2
        where: matrix_pinky_bottom
        adjust.shift: [-7, -13]
        adjust.rotate: 90
      ledFirst: &ledFirst
        what: ceoloide/led_sk6812mini-e
        where: matrix_outer_num
        params:
          P1: RAW
          P2: LED_OUT # Trust me it makes senss
          P3: GND
          P4: P7 #GP7
        adjust.shift: [0, 5]
      ledSet1: &ledSet1
        what: ceoloide/led_sk6812mini-e
        where: /^matrix_(index|ring|outer_top|outer_home|outer_bottom|thumb_inner)/
        params:
          P1: RAW
          P2: LED_OUT
          P3: GND
          P4: LED_IN
        adjust.shift: [0, 5]
      ledSet2: &ledSet2
        what: ceoloide/led_sk6812mini-e
        where: /^matrix_(inner|middle|pinky|thumb_center)/
        params:
          P1: RAW
          P2: LED_IN # LED_IN -> To next LED Trust me it makes sense
          P3: GND
          P4: LED_OUT #  LED_OUT -> To this pin
        adjust.shift: [0, 5]
      ledLast: &ledLast
        what: ceoloide/led_sk6812mini-e
        where: matrix_thumb_outer
        params:
          P1: RAW
          P2: undefined
          P3: GND
          P4: LED_IN
        adjust.shift: [0, 5]
      mountingHoles: &holes
        what: ceoloide/mounting_hole_npth
        where: /^screw/
      rowRoute1: &rowRoute1
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(-8.2,3.8)(-8.2,0.2)"
      rowRoute2: &rowRoute2
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(-8.2,-3.2)(-8.2,-8.7)v"
      colRoute: &colRoute
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(4.3,6)(8.6,6)"
      gndRoute: &gndRoute
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(-2.7,-5.8)(-2.7,-8.1)v"
      5vRoute: &5vRoute
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(2.7,-4.4)(5.2,-4.4)(5.2,-6.9)v"
      outRoute: &outRoute
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(2.7,-5.8)(4.2,-5.8)v(6.2,-5.8)"
      inRoute: &inRoute
        what: ceoloide/utility_router
        where: /^matrix/
        params:
          width: 0.2
          route: "b(-2.7,-4.4)(-4.7,-4.4)v(-9.2,-4.4)"
      orientationText: &orientationText
        what: ceoloide/utility_text
        where: matrix_index_num
        params:
          text: "(left) ⌨"
          height: 2
          width: 2
        adjust:
          shift: [0, 12]
      byText: &byText
        what: ceoloide/utility_text
        where: matrix_index_num
        params:
          text: "NWSplit Rev. V \\nby NWSteenberg"
        adjust:
          shift: [0, 17]
      ergogenLogo: &ergogenLogo
        what: ceoloide/utility_ergogen_logo
        where: matrix_index_bottom
        adjust:
          shift: [6.5, -12]
  pcbRight:
    template: kicad8
    outlines:
      - outline: _outlinePCBRight
    footprints:
      mcu:
        <<: *mcu
        where: mirror_matrix_outer_num
        adjust.shift: [8.14, 10+20.38]
      socketsChocv2:
        <<: *sockets
        where: /^mirror_matrix/
      diode:
        <<: *diode
        where: /^mirror_matrix/
        adjust.shift: [8.25, 1.5]
        adjust.rotate: 90
      usbBreakout:
        <<: *usbBreakout
        where: mirror_matrix_inner_num
      usbRecepticle:
        <<: *usbRecepticle
        where: mirror_matrix_inner_num
      reset: 
        <<: *reset
        where: mirror_matrix_outer_num
      power: 
        <<: *power
        where: mirror_matrix_outer_top
      batteryConnector: 
        <<: *batteryConnector
        where: mirror_matrix_pinky_bottom
      ledFirst:
        <<: *ledFirst
        where: mirror_matrix_outer_num
        adjust.rotate: 180
      ledSet1:
        <<: *ledSet1
        where: /^mirror_matrix_(index|ring|outer_top|outer_home|outer_bottom|thumb_inner)/
        adjust.rotate: 180
      ledSet2:
        <<: *ledSet2
        where: /^mirror_matrix_(inner|middle|pinky|thumb_center)/
        adjust.rotate: 180
      ledLast:
        <<: *ledLast
        where: mirror_matrix_thumb_outer
        adjust.rotate: 180
      mountingHoles:
        <<: *holes
        where: /^mirror_screw/
      rowRoute1:
        <<: *rowRoute1
        where: /^mirror_matrix/
      rowRoute2:
        <<: *rowRoute2
        where: /^mirror_matrix/
      colRoute:
        <<: *colRoute
        where: /^mirror_matrix/
      gndRoute:
        <<: *gndRoute
        where: /^mirror_matrix/
        params:
          width: 0.2
          route: "b(2.7,-4.4)(5.2,-4.4)(5.2,-6.9)v"
      5vRoute:
        <<: *5vRoute
        where: /^mirror_matrix/
        params:
          width: 0.2
          route: "b(-2.7,-5.8)(-5.2,-5.8)(-5.2,-6.9)v"
      outRoute:
        <<: *outRoute
        where: /^mirror_matrix/
        params:
          width: 0.2
          route: "b(-2.7,-4.4)(-4.2,-4.4)v(-6.2,-4.4)"
      inRoute:
        <<: *inRoute
        where: /^mirror_matrix/
        params:
          width: 0.2
          route: "b(2.7,-5.8)(4.2,-5.8)v(7.7,-5.8)"
      orientationText:
        <<: *orientationText
        where: mirror_matrix_index_num
        params:
          text: "(right) ⌨"
          height: 2
          width: 2
      byText:
        <<: *byText
        where: mirror_matrix_index_num
      ergogenLogo:
        <<: *ergogenLogo
        where: mirror_matrix_index_bottom
