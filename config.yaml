units:
  outlinePadding: 1

  plateThickness: 1.6
  pcbThickness: 1.6

  keyCutoutDimentions: 13.95

  # Case
  baseHeight: 2
  screwRadius: 1.1 # M2 + 0.2mm buffer
  screwHeadRadius: 2.1 # 4mm + 0.2mm buffer
  standoffRadius: 1.6 # (3.5 OD - 0.3) / 2
  standoffWallThickness: 0.8 #mm
  fromPlateToTop: 5

  baseWallHeight: baseHeight + pcbThickness
  topWallHeight: 2.2
  wallThickness: 1.6

points:
  zones:
    matrix:
      anchor:
        shift: [40, -180] # Move into KiCAD position
      columns:
        outer.key.column_net: "GP29"

        pinky.key.column_net: "GP28"
        pinky.key.stagger: 0.1U

        ring.key.column_net: "GP27"
        ring.key.stagger: 0.6U

        middle.key.column_net: "GP26"
        middle.key.stagger: 0.2U

        index.key.column_net: "GP15"
        index.key.stagger: -0.25U

        inner.key.column_net: "GP14"
        inner.key.stagger: -0.2U
      rows:
        bottom.row_net: "GP12"
        home.row_net: "GP11"
        top.row_net: "GP10"
        num.row_net: "GP9"
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [0U, -1.3U]
      columns:
        inner:
          key.name: matrix_thumb_inner
          key.column_net: "GP26"
          key.origin: [-0.5U, -0.5U]
        center:
          key.name: matrix_thumb_center
          key.column_net: "GP15"
          key.splay: -15
          key.origin: [-0.5U, -0.5U]
        outer:
          key.name: matrix_thumb_outer
          key.column_net: "GP14"
          key.splay: -10
          key.origin: [-0.5U, -0.5U]
      rows:
        only:
          row_net: "GP13"
    screw_1:
      anchor:
        - ref: matrix_inner_bottom
          shift: [13, -9.5]
    screw_2:
      anchor:
        - ref: matrix_inner_num
          shift: [13, 21.5]
    screw_3:
      anchor:
        - ref: matrix_ring_num
          shift: [-9.5, 15]
    screw_4:
      anchor:
        - ref: matrix_outer_num
          shift: [-13, 5]
    screw_5:
      anchor:
        - ref: matrix_outer_bottom
          shift: [-13, -13]
    screw_6:
      anchor:
        - ref: matrix_middle_bottom
          shift: [0, -25]
    screw_7:
      anchor:
        - ref: matrix_thumb_outer
          shift: [8.5, 8.5]
  mirror:
    ref: matrix_pinky_home
    distance: 270
outlines:
  _keysCutout:
    - what: rectangle
      size: [keyCutoutDimentions, keyCutoutDimentions]
      fillet: 0.1

  _rightSubstitution:
    - what: rectangle
      size: 10U
      where:
        ref: mirror_matrix_middle_home

  _leftSubstitution:
    - what: rectangle
      size: 10U
      where:
        ref: matrix_middle_home

  _bottomKeyCutout:
    - what: rectangle
      size: [16.5, 15.5]
      adjust.shift: [-1.5, -1]
      fillet: 4

  _bottomMCUCutout:
    - what: rectangle
      size: [18.5, 24+2]
      where: /matrix_outer_num/
      adjust.shift: [-4.51-1, 20.15]
      adjust.rotate: 90
      fillet: 0.5

  _bottomTRRSCutout:
    - what: rectangle
      size: [6.5, 13.1]
      where: /matrix_inner_num/
      adjust.shift: [0, 18.9]
      fillet: 0.5

  _mcuCutout:
    - what: rectangle
      size: [13, 4.5]
      adjust.shift: [0, -4]
    - what: rectangle
      size: [9.5, 8]
      adjust.shift: [0, 11.75-4+1]
      expand: 0.1

  _USBCutout:
    - what: rectangle
      size: [10, 20]
      where: /matrix_outer_num/
      adjust.shift: [-10, 20.15]
      adjust.rotate: 90
      fillet: 0.5

  _mcuBuffer:
    - what: outline
      name: _mcuCutout
      where: /matrix_outer_num/
      adjust.shift: [-4.51, 20.15]
      adjust.rotate: 90
      fillet: 0.5

  _holesTop:
    - what: circle
      radius: standoffRadius
      where: /screw/
    - what: circle
      radius: standoffRadius+1
      where: /screw_7/
      operation: subtract
    - what: circle
      radius: screwRadius
      where: /screw_7/

  _screwRecess:
    - what: circle
      radius: screwHeadRadius
      where: /screw/

  _screwRecessPlate:
    - what: circle
      radius: screwHeadRadius
      where: /screw_7/

  _standOff:
    - what: circle
      radius: standoffRadius
      expand: standoffWallThickness
      where: /screw_7/
    - what: circle
      radius: standoffRadius
      operation: subtract
      where: /screw_7/

  # Main outline
  outline:
    - what: polygon
      points:
        - ref: matrix_outer_bottom
          shift: [-0.8U, -0.8U]
        - ref: matrix_middle_num
          shift: [-3.8U, 0.8U]
        - ref: matrix_middle_num
          shift: [2.8U, 0.8U]
        - ref: matrix_middle_num
          shift: [2.8U, -4.5U]
        - ref: matrix_thumb_outer
          shift: [-1U, 0.5U]
        - ref: matrix_thumb_outer
          shift: [0.5U, 0.5U]
        - ref: matrix_outer_bottom
          shift: [3.5U, -0.8U]
    - what: polygon
      points:
        - ref: mirror_matrix_outer_bottom
          shift: [-0.8U, -0.8U]
        - ref: mirror_matrix_middle_num
          shift: [-3.8U, 0.8U]
        - ref: mirror_matrix_middle_num
          shift: [2.8U, 0.8U]
        - ref: mirror_matrix_middle_num
          shift: [2.8U, -4.5U]
        - ref: mirror_matrix_thumb_outer
          shift: [-1U, 0.5U]
        - ref: mirror_matrix_thumb_outer
          shift: [0.5U, 0.5U]
        - ref: mirror_matrix_outer_bottom
          shift: [3.5U, -0.8U]
      fillet: 0.5
    # Around keys
    - what: rectangle
      where: /matrix/
      size: [U, U]
      expand: outlinePadding
      fillet: 0.5

  _outlinePCB:
    - what: outline
      name: outline
    # MCU cutout
    - what: rectangle
      size: [25, 13.15]
      where: /matrix_outer_num/
      adjust.shift: [-7.76, 20.15]
      operation: subtract
      fillet: 0.5

  _outlinePCBLeft:
    - what: outline
      name: _outlinePCB
    - what: outline
      name: _rightSubstitution
      operation: subtract

  _outlinePCBRight:
    - what: outline
      name: _outlinePCB
    - what: outline
      name: _leftSubstitution
      operation: subtract

  _outlinePlate:
    - what: outline
      name: outline
      # TRRS cutout
    - what: rectangle
      size: [6.5, 14]
      where: /matrix_inner_num/
      adjust.shift: [0, 19.4]
      operation: subtract
      # MCU Cutout
    - what: outline
      name: _mcuBuffer
      operation: subtract
    - what: outline
      name: _keysCutout
      operation: subtract
      where: /matrix/

  _plate:
    - what: outline
      name: _outlinePlate
    - what: outline
      name: _rightSubstitution
      operation: subtract

  # Case Outlines
  _caseOutline:
    - what: outline
      name: outline
      expand: 0.5

  _caseWalls:
    - what: outline
      name: _caseOutline
      expand: wallThickness
    - what: outline
      name: _caseOutline
      operation: subtract

  _TRRSCutout:
    - what: rectangle
      size: [6.5, 20]
      where: /matrix_inner_num/
      adjust.shift: [0, 22.4]

  _casePlate:
    - what: outline
      name: _caseOutline
      # TRRS cutout
    - what: rectangle
      size: [6.5, 14]
      where: /matrix_inner_num/
      adjust.shift: [0, 19.4]
      operation: subtract
      # MCU Cutout
    - what: outline
      name: _mcuBuffer
      operation: subtract
    - what: outline
      name: _keysCutout
      operation: subtract
      where: /matrix/

  _keySupportPlate:
    - what: rectangle
      where: /matrix/
      size: [20, 20]
      fillet: 1
    - what: rectangle
      where: /matrix/
      size: [keyCutoutDimentions, keyCutoutDimentions]
      operation: subtract
  _caseTop:
    - what: outline
      name: _caseOutline
      expand: wallThickness
    - what: outline
      name: _caseWalls
    - what: rectangle
      size: [20, 20]
      where: /matrix/
      operation: subtract
    - what: polygon
      points:
        - ref: matrix_thumb_outer
          shift: [0, 11]
        - ref: matrix_thumb_outer
          shift: [-25, 11]
        - ref: matrix_index_home
          shift: [-10, 0]
        - ref: matrix_index_home
          shift: [-10, -40]
        - ref: matrix_thumb_inner
          shift: [10, -10]
        - ref: matrix_thumb_outer
      operation: subtract
    - what: polygon
      points:
        - ref: matrix_inner_bottom
          shift: [10, 0]
        - ref: matrix_inner_bottom
          shift: [10, -20]
        - ref: matrix_inner_bottom
          shift: [-10, -20]
      operation: subtract
    - what: polygon
      points:
        - ref: matrix_thumb_inner
          shift: [-20, -5.96]
        - ref: matrix_thumb_inner
          shift: [0, -5.96]
        - ref: matrix_thumb_inner
          shift: [0, 0]
        - ref: matrix_inner_bottom
          shift: [18.45, -30]
        - ref: matrix_inner_bottom
          shift: [18.45, -5]
        - ref: matrix_thumb_outer
          shift: [20, 20]
        - ref: matrix_thumb_outer
          shift: [20, -20]
        - ref: matrix_thumb_inner
          shift: [-20, -20]
      operation: subtract
    - what: polygon
      points:
        - ref: mirror_matrix_thumb_outer
          shift: [0, 11]
        - ref: mirror_matrix_thumb_outer
          shift: [-25, 11]
        - ref: mirror_matrix_index_home
          shift: [-10, 0]
        - ref: mirror_matrix_index_home
          shift: [-10, -40]
        - ref: mirror_matrix_thumb_inner
          shift: [10, -10]
        - ref: mirror_matrix_thumb_outer
      operation: subtract
    - what: polygon
      points:
        - ref: mirror_matrix_inner_bottom
          shift: [10, 0]
        - ref: mirror_matrix_inner_bottom
          shift: [10, -20]
        - ref: mirror_matrix_inner_bottom
          shift: [-10, -20]
      operation: subtract
    - what: polygon
      points:
        - ref: mirror_matrix_thumb_inner
          shift: [-20, -5.96]
        - ref: mirror_matrix_thumb_inner
          shift: [0, -5.96]
        - ref: mirror_matrix_thumb_inner
          shift: [0, 0]
        - ref: mirror_matrix_inner_bottom
          shift: [18.45, -30]
        - ref: mirror_matrix_inner_bottom
          shift: [18.45, -5]
        - ref: mirror_matrix_thumb_outer
          shift: [20, 20]
        - ref: mirror_matrix_thumb_outer
          shift: [20, -20]
        - ref: mirror_matrix_thumb_inner
          shift: [-20, -20]
      operation: subtract
      fillet: 0.75

  outlineBottom:
    - what: outline
      name: _caseOutline
    - what: outline
      name: _bottomKeyCutout
      where: /matrix/
      operation: subtract
    - what: outline
      name: _bottomTRRSCutout
      operation: subtract
    - what: outline
      name: _bottomMCUCutout
      operation: subtract
    - what: circle
      radius: screwRadius
      where: /screw/
      operation: subtract

  representation:
    - what: outline
      name: _caseWalls
    - what: outline
      name: _caseTop
    - what: rectangle
      size: [18, 18]
      where: /matrix/
      operation: stack

cases:
  _bottom:
    - what: outline
      name: outlineBottom
      extrude: baseHeight
    - what: outline
      name: _caseWalls
      extrude: baseWallHeight
    - what: outline
      name: _screwRecess
      extrude: 0.6
      operation: subtract
    - what: outline
      name: _standOff
      extrude: baseHeight
    - what: outline
      name: _USBCutout
      shift: [0, 0, baseHeight]
      extrude: 3
      operation: subtract
    - what: outline
      name: _TRRSCutout
      shift: [0, 0, baseHeight+pcbThickness]
      extrude: 5.5
      operation: subtract

  bottomLeft:
    - what: case
      name: _bottom
    - what: outline
      name: _rightSubstitution
      extrude: 100
      shift: [0, 0, -50]
      operation: subtract

  bottomRight:
    - what: case
      name: _bottom
    - what: outline
      name: _leftSubstitution
      extrude: 100
      shift: [0, 0, -50]
      operation: subtract

  _top:
    - what: outline
      name: _caseWalls
      extrude: topWallHeight
    - what: outline
      name: _keySupportPlate
      extrude: topWallHeight
    - what: outline
      name: _casePlate
      extrude: plateThickness
      shift: [0, 0, 2.2-plateThickness]
    - what: outline
      name: _screwRecessPlate
      extrude: 0.6
      shift: [0, 0, 2.2-0.6]
      operation: subtract
    - what: outline
      name: _caseTop
      extrude: 5+2.2
    - what: outline
      name: _holesTop
      extrude: 2.5
      operation: subtract
    - what: outline
      name: _USBCutout
      shift: [0, 0, -pcbThickness]
      extrude: 3
      operation: subtract
    - what: outline
      name: _TRRSCutout
      extrude: 5.5
      operation: subtract

  topLeft:
    - what: case
      name: _top
    - what: outline
      name: _rightSubstitution
      extrude: 100
      shift: [0, 0, -50]
      operation: subtract

  topRight:
    - what: case
      name: _top
    - what: outline
      name: _leftSubstitution
      extrude: 100
      shift: [0, 0, -50]
      operation: subtract

pcbs:
  plate:
    template: kicad8
    outlines:
      - outline: _plate
    footprints:
      mounting_holes:
        what: ceoloide/mounting_hole_npth
        where: /^screw/
  pcbLeft:
    template: kicad8
    outlines:
      - outline: _outlinePCBLeft
    footprints:
      mcu: &mcu
        what: rp2040zero
        where: matrix_outer_num
        params:
          flip: false
          side: B
        adjust.shift: [8.14, 10]
        adjust.rotate: 90
      socketsChocv2: &sockets
        what: ceoloide/switch_choc_v1_v2
        where: /^matrix/
        params:
          choc_v1_support: true
          include_stabilizer_pad: false
          include_keycap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
        adjust.rotate: 180
      diode: &diode
        what: ceoloide/diode_tht_sod123
        where: /^matrix/
        params:
          include_tht: false
          include_traces_vias: true
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust.shift: [-8.25, 1.5]
        adjust.rotate: 90
      trrs: &trrs
        what: ceoloide/trrs_pj320a
        where: matrix_inner_num
        params:
          SL: GND #GND Recommended
          R2: GP0 #GP0 UART0 TX
          R1: GP1 #GP1 UART0 RX
          TP: P3V3 #3v3 (OUT) Recommended
        adjust.shift: [0, 24.8]
      ledFirst: &ledFirst
        what: ceoloide/led_sk6812mini-e
        where: matrix_outer_num
        params:
          P1: P5V
          P2: LED_OUT # Trust me it makes senss
          P3: GND
          P4: GP2
        adjust.shift: [0, 5]
      ledSet1: &ledSet1
        what: ceoloide/led_sk6812mini-e
        where: /^matrix_(index|ring|outer_top|outer_home|outer_bottom|thumb_center)/
        params:
          P1: P5V
          P2: LED_OUT
          P3: GND
          P4: LED_IN
        adjust.shift: [0, 5]
      ledSet2: &ledSet2
        what: ceoloide/led_sk6812mini-e
        where: /^matrix_(inner|middle|pinky|thumb_inner)/
        params:
          P1: P5V
          P2: LED_IN # LED_IN -> To next LED Trust me it makes sense
          P3: GND
          P4: LED_OUT #  LED_OUT -> To this pin
        adjust.shift: [0, 5]
      ledLast: &ledLast
        what: ceoloide/led_sk6812mini-e
        where: matrix_thumb_outer
        params:
          P1: P5V
          P2: GP3
          P3: GND
          P4: LED_OUT
        adjust.shift: [0, 5]
      mountingHoles: &holes
        what: ceoloide/mounting_hole_npth
        where: /^screw/
  pcbRight:
    template: kicad8
    outlines:
      - outline: _outlinePCBRight
    footprints:
      mcu:
        <<: *mcu
        where: mirror_matrix_outer_num
        adjust.shift: [8.14, 10+20.38]
      socketsChocv2:
        <<: *sockets
        where: /^mirror_matrix/
      diode:
        <<: *diode
        where: /^mirror_matrix/
        adjust.shift: [8.25, 1.5]
      trrs:
        <<: *trrs
        where: mirror_matrix_inner_num
      ledFirst:
        <<: *ledFirst
        where: mirror_matrix_outer_num
      ledSet1:
        <<: *ledFirst
        where: /^mirror_matrix_(index|ring|outer_top|outer_home|outer_bottom|thumb_center)/
      ledSet2:
        <<: *ledSet2
        where: /^mirror_matrix_(inner|middle|pinky|thumb_inner)/
      ledLast:
        <<: *ledLast
        where: mirror_matrix_thumb_outer
      mountingHoles:
        <<: *holes
        where: /^mirror_screw/
