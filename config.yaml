units:
  outlinePadding: 1

  plateThickness: 1.6
  pcbThickness: 1.6

  keyCutoutDimentions: 13.95

  # Case
  baseHeight: 2
  screwRadius: 1.1 # M2 + 0.2mm buffer
  screwHeadRadius: 2.1 # 4mm + 0.2mm buffer
  standoffRadius: 1.6 # (3.5 OD - 0.3) / 2
  standoffWallThickness: 0.8 #mm
  fromPlateToTop: 5

  baseWallHeight: baseHeight + pcbThickness
  topWallHeight: 2.2
  wallThickness: 1.6

points:
  zones:
    matrix:
      anchor:
        shift: [40, -180] # Move into KiCAD position
      columns:
        outer.key.column_net: "P21" # "GP29"

        pinky.key.column_net: "P20" # "GP28"
        pinky.key.stagger: 0.1U

        ring.key.column_net: "P19" # "GP27" 
        ring.key.stagger: 0.6U

        middle.key.column_net: "P18" # "GP26"
        middle.key.stagger: 0.2U

        index.key.column_net: "P15" # "GP22"
        index.key.stagger: -0.25U

        inner.key.column_net: "P14" # "GP20"
        inner.key.stagger: -0.2U
      rows:
        bottom.row_net: "P5" # "GP5"
        home.row_net: "P4" # "GP4"
        top.row_net: "P3" # "GP3"
        num.row_net: "P2" # "GP2"
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [0U, -1.3U]
      columns:
        inner:
          key.name: matrix_thumb_inner
          key.column_net: "P18" # "GP26"
          key.origin: [-0.5U, -0.5U]
        center:
          key.name: matrix_thumb_center
          key.column_net: "P15" # "GP22"
          key.splay: -15
          key.origin: [-0.5U, -0.5U]
        outer:
          key.name: matrix_thumb_outer
          key.column_net: "P14" # "GP20"
          key.splay: -10
          key.origin: [-0.5U, -0.5U]
      rows:
        only:
          row_net: "P6" # "GP6"
    screw_1:
      anchor:
        - ref: matrix_inner_bottom
          shift: [13, -9.5]
    screw_2:
      anchor:
        - ref: matrix_inner_num
          shift: [13, 21.5]
    screw_3:
      anchor:
        - ref: matrix_ring_num
          shift: [-18, 15]
    screw_4:
      anchor:
        - ref: matrix_outer_num
          shift: [-13, 9.5]
    screw_5:
      anchor:
        - ref: matrix_outer_bottom
          shift: [-13, -13]
    screw_6:
      anchor:
        - ref: matrix_middle_bottom
          shift: [6, -13]
    screw_7:
      anchor:
        - ref: matrix_thumb_outer
          shift: [8.5, 8.5]
  mirror:
    ref: matrix_pinky_home
    distance: 270
outlines:
  _keysCutout:
    - what: rectangle
      size: [keyCutoutDimentions, keyCutoutDimentions]
      fillet: 0.1

  _rightSubstitution:
    - what: rectangle
      size: 10U
      where:
        ref: mirror_matrix_middle_home

  _leftSubstitution:
    - what: rectangle
      size: 10U
      where:
        ref: matrix_middle_home

  _bottomKeyCutout:
    - what: rectangle
      size: [16.5, 15.5]
      adjust.shift: [-1.5, -1]
      fillet: 4

  _bottomMCUCutout:
    - what: rectangle
      size: [18.5, 24+2]
      where: /matrix_outer_num/
      adjust.shift: [-4.51-1, 20.15]
      adjust.rotate: 90
      fillet: 0.5
    

  _bottomUSBCutout:
    - what: rectangle
      size: [10, 2.2]
      where: /matrix_inner_num/
      adjust.shift: [0, 13.1]
      fillet: 0.5

  _mcuButtonCutout:
    - what: rectangle
      size: [13, 4.5]
      adjust.shift: [0, -4]

  _mcuCutout:
    - what: rectangle
      size: [13, 4.5]
      adjust.shift: [0, -4]
    - what: rectangle
      size: [9.5, 12]
      adjust.shift: [0, 11.75-4+1+2]
      expand: 0.1

  #_mcuBuffer:
  #  - what: outline
  #    name: _mcuCutout
  #    where: /matrix_outer_num/
  #    adjust.shift: [-4.51, 20.15]
  #    adjust.rotate: 90
  #    fillet: 0.5
  
  _mcuBuffer:
    - what: rectangle
      size: [36.5, 18]
      where: matrix_outer_num
      adjust.shift: [1.3, 22]
      fillet: 0.5

  _batteryCutoutPCB:
    - what: rectangle
      size: [36, 18.5]
      where: /matrix_ring_bottom/
      adjust.shift: [9.5, -20.75]

  _USBCutout:
    - what: rectangle
      size: [12.5, 17.3]
      where: /matrix_inner_num/
      adjust.shift: [0, 19.35]
      fillet: 0.5

  _holesTop:
    - what: circle
      radius: standoffRadius
      where: /screw/
    - what: circle
      radius: standoffRadius+1
      where: /screw_7/
      operation: subtract
    - what: circle
      radius: screwRadius
      where: /screw_7/

  _screwRecess:
    - what: circle
      radius: screwHeadRadius
      where: /screw/
    - what: circle
      radius: standoffRadius+1
      where: /screw_7/
      operation: subtract

  _screwRecessPlate:
    - what: circle
      radius: screwHeadRadius
      where: /screw_7/

  _standOff:
    - what: circle
      radius: standoffRadius
      expand: standoffWallThickness
      where: /screw_7/
    - what: circle
      radius: standoffRadius
      operation: subtract
      where: /screw_7/

  # Main outline
  _outline:
    - what: polygon
      points:
        - ref: matrix_outer_bottom
          shift: [-0.8U, -0.8U]
        - ref: matrix_middle_num
          shift: [-3.8U, 0.8U]
        - ref: matrix_middle_num
          shift: [2.8U, 0.8U]
        - ref: matrix_middle_num
          shift: [2.8U, -4.5U]
        - ref: matrix_thumb_outer
          shift: [-1U, 0.5U]
        - ref: matrix_thumb_outer
          shift: [0.5U, 0.5U]
        - ref: matrix_outer_bottom
          shift: [3.5U, -0.8U]
    - what: polygon
      points:
        - ref: mirror_matrix_outer_bottom
          shift: [-0.8U, -0.8U]
        - ref: mirror_matrix_middle_num
          shift: [-3.8U, 0.8U]
        - ref: mirror_matrix_middle_num
          shift: [2.8U, 0.8U]
        - ref: mirror_matrix_middle_num
          shift: [2.8U, -4.5U]
        - ref: mirror_matrix_thumb_outer
          shift: [-1U, 0.5U]
        - ref: mirror_matrix_thumb_outer
          shift: [0.5U, 0.5U]
        - ref: mirror_matrix_outer_bottom
          shift: [3.5U, -0.8U]
      fillet: 0.5
    # Around keys
    - what: rectangle
      where: /matrix/
      size: [U, U]
      expand: outlinePadding
      fillet: 0.5

  _outlinePCB:
    - what: outline
      name: _outline
    - what: outline
      name: _batteryCutoutPCB
      operation: subtract
      fillet: 0.5

  _outlinePCBLeft:
    - what: outline
      name: _outlinePCB
    - what: outline
      name: _rightSubstitution
      operation: subtract

  _outlinePCBRight:
    - what: outline
      name: _outlinePCB
    - what: outline
      name: _leftSubstitution
      operation: subtract

  _outlinePlate:
    - what: outline
      name: _outline
      # USB cutout
    - what: outline
      name: _USBCutout
      operation: subtract
      # MCU Cutout
    - what: outline
      name: _mcuBuffer
      operation: subtract
      fillet: 0.5
    - what: outline
      name: _keysCutout
      operation: subtract
      where: /matrix/

  plate:
    - what: outline
      name: _outlinePlate
    - what: outline
      name: _rightSubstitution
      operation: subtract

  # Case Outlines
  _caseOutline:
    - what: outline
      name: _outline
      expand: 0.5

  _caseWalls:
    - what: outline
      name: _caseOutline
      expand: wallThickness
    - what: outline
      name: _caseOutline
      operation: subtract

  _casePlate:
    - what: outline
      name: _caseOutline
    - what: outline
      name: _keysCutout
      operation: subtract
      where: /matrix/

  _keySupportPlate:
    - what: outline
      name: _casePlate
    - what: rectangle
      size: [keyCutoutDimentions+1, keyCutoutDimentions+1]
      where: /matrix/
      operation: subtract

  _caseTop:
    - what: outline
      name: _caseOutline
      expand: wallThickness
    - what: outline
      name: _caseWalls
    - what: rectangle
      size: [20, 20]
      where: /matrix/
      operation: subtract
    - what: polygon
      points:
        - ref: matrix_thumb_outer
          shift: [0, 11]
        - ref: matrix_thumb_outer
          shift: [-25, 11]
        - ref: matrix_index_home
          shift: [-10, 0]
        - ref: matrix_index_home
          shift: [-10, -40]
        - ref: matrix_thumb_inner
          shift: [10, -10]
        - ref: matrix_thumb_outer
      operation: subtract
    - what: polygon
      points:
        - ref: matrix_inner_bottom
          shift: [10, 0]
        - ref: matrix_inner_bottom
          shift: [10, -20]
        - ref: matrix_inner_bottom
          shift: [-10, -20]
      operation: subtract
    - what: polygon
      points:
        - ref: matrix_thumb_inner
          shift: [-20, -5.96]
        - ref: matrix_thumb_inner
          shift: [0, -5.96]
        - ref: matrix_thumb_inner
          shift: [0, 0]
        - ref: matrix_inner_bottom
          shift: [18.45, -30]
        - ref: matrix_inner_bottom
          shift: [18.45, -5]
        - ref: matrix_thumb_outer
          shift: [20, 20]
        - ref: matrix_thumb_outer
          shift: [20, -20]
        - ref: matrix_thumb_inner
          shift: [-20, -20]
      operation: subtract
    - what: polygon
      points:
        - ref: mirror_matrix_thumb_outer
          shift: [0, 11]
        - ref: mirror_matrix_thumb_outer
          shift: [-25, 11]
        - ref: mirror_matrix_index_home
          shift: [-10, 0]
        - ref: mirror_matrix_index_home
          shift: [-10, -40]
        - ref: mirror_matrix_thumb_inner
          shift: [10, -10]
        - ref: mirror_matrix_thumb_outer
      operation: subtract
    - what: polygon
      points:
        - ref: mirror_matrix_inner_bottom
          shift: [10, 0]
        - ref: mirror_matrix_inner_bottom
          shift: [10, -20]
        - ref: mirror_matrix_inner_bottom
          shift: [-10, -20]
      operation: subtract
    - what: polygon
      points:
        - ref: mirror_matrix_thumb_inner
          shift: [-20, -5.96]
        - ref: mirror_matrix_thumb_inner
          shift: [0, -5.96]
        - ref: mirror_matrix_thumb_inner
          shift: [0, 0]
        - ref: mirror_matrix_inner_bottom
          shift: [18.45, -30]
        - ref: mirror_matrix_inner_bottom
          shift: [18.45, -5]
        - ref: mirror_matrix_thumb_outer
          shift: [20, 20]
        - ref: mirror_matrix_thumb_outer
          shift: [20, -20]
        - ref: mirror_matrix_thumb_inner
          shift: [-20, -20]
      operation: subtract
      fillet: 0.75

  _outlineBottom:
    - what: outline
      name: _caseOutline
    - what: outline
      name: _bottomKeyCutout
      where: /matrix/
      operation: subtract
    - what: outline
      name: _bottomUSBCutout
      operation: subtract
    - what: outline
      name: _bottomMCUCutout
      operation: subtract
    - what: circle
      radius: screwRadius
      where: /screw/
      operation: subtract
    - what: circle
      radius: standoffRadius
      where: /screw_7/
      operation: subtract

  representation:
    - what: outline
      name: _caseWalls
    - what: outline
      name: _caseTop
    - what: rectangle
      size: [18, 18]
      where: /matrix/
      operation: stack

